name: Android checks

on:
  pull_request:
  push:
    branches: [main, 'fix/root-renderer-restart-recovery']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Archive the exact source under test
        run: git archive HEAD > "$RUNNER_TEMP/hilight-source.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-${{ github.sha }}
          path: ${{ runner.temp }}/hilight-source.tar
          retention-days: 7
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test process discovery without Android SDK
        run: |
          mkdir -p "$RUNNER_TEMP/scanner-test"
          javac --release 17 -d "$RUNNER_TEMP/scanner-test" core/src/com/hilight/core/RendererProcessScanner.java app/src/test/java/com/hilight/core/RendererProcessScannerSelfTest.java
          java -cp "$RUNNER_TEMP/scanner-test" com.hilight.core.RendererProcessScannerSelfTest
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install Android platform
        run: sdkmanager --channel=3 'platforms;android-37.0' 'build-tools;36.1.0'
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - name: Test, build, and lint
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:build :app:lint
      - name: Build standalone helper
        run: ./scripts/build-helper.sh
      - name: Verify optimized privileged entry points
        run: |
          release_apk=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$release_apk"
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" dex packages "$release_apk" > "$RUNNER_TEMP/dex-packages.txt"
          grep -q 'com.hilight.core.AdbHelper' "$RUNNER_TEMP/dex-packages.txt"
          grep -q 'com.hilight.core.RendererProcessScanner' "$RUNNER_TEMP/dex-packages.txt"
          grep -q 'com.hilight.studio.HiLightUserService' "$RUNNER_TEMP/dex-packages.txt"
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reports-${{ github.sha }}
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7
      - name: Upload experimental debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: experimental-debug-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
